services:
  whatsapp-sender:
    build: .
    # Coolify's proxy routes to this container port directly; the host port
    # mapping is only needed when running locally without a reverse proxy.
    expose:
      - "80"
    ports:
      - "8080:80"
    volumes:
      - wwebjs_auth:/data/.wwebjs_auth
      - uploads:/app/uploads
    restart: unless-stopped
    shm_size: "256mb"
    environment:
      - PORT=80
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - WWEBJS_AUTH_PATH=/data/.wwebjs_auth
      # On every start (including restart), pull main if GitHub has a new commit.
      # Set AUTO_UPDATE=false to keep the image exactly as built.
      - AUTO_UPDATE=true
      - GIT_BRANCH=main
      - GIT_REPO_URL=https://github.com/sa3eedDev/whatsapp-sender.git

volumes:
  wwebjs_auth:
  uploads:
